<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- מילת החיפוש הייחודית עבור גוגל -->
    <title>אופים סיפורים עם לימור - ספר הסיפורים הכיתתי</title>
    <meta name="description" content="אופים סיפורים עם לימור - כניסת תלמידים ומורה לכתיבת ספר הסיפורים הכיתתי">
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #e3f2fd;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
            text-align: center;
            max-width: 500px;
            width: 100%;
            border: 4px solid #64b5f6;
        }
        h1 {
            color: #1565c0;
            font-size: 32px;
            margin-bottom: 10px;
        }
        p {
            font-size: 20px;
            color: #555;
            margin-bottom: 30px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 20px;
            margin: 15px 0;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-decoration: none;
            border-radius: 15px;
            box-sizing: border-box;
            transition: transform 0.1s;
        }
        .btn:hover {
            transform: scale(1.02);
        }
        .btn-student {
            background-color: #ff9800;
            box-shadow: 0 4px 0 #e65100;
        }
        .btn-teacher {
            background-color: #2196F3;
            box-shadow: 0 4px 0 #0d47a1;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>📚 אופים סיפורים עם לימור</h1>
    <p>ברוכים הבאים! בחרו איך תרצו להיכנס:</p>
    
    <a href="student.html" class="btn btn-student">👦👧 כניסת תלמידים</a>
    <a href="teacher.html" class="btn btn-teacher">👩‍🏫 כניסת מורה</a>
</div>

</body>
</html>
